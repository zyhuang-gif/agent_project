tool_name_prefix: true
servers:
  gmail:
    enabled: true
    transport: stdio
    command: python
    args: ["-m", "mcp_servers.gmail.server"]
    include_tools: ["send_email"]
    env:
      GMAIL_CREDENTIALS_PATH: "${GMAIL_CREDENTIALS_PATH}"
      GMAIL_TOKEN_PATH: "${GMAIL_TOKEN_PATH}"
      GMAIL_SENDER_EMAIL: "${GMAIL_SENDER_EMAIL}"
      # 只把代理注入 gmail 子进程，避免主后端父进程被误路由到代理。
      # ${VAR?} 表示可选：未设时不传给子进程；国外部署直连时可不配。
      HTTPS_PROXY: "${GMAIL_HTTPS_PROXY?}"
      HTTP_PROXY: "${GMAIL_HTTP_PROXY?}"
  contacts:
    enabled: true
    transport: stdio
    command: python
    args: ["-m", "mcp_servers.contacts.server"]
    include_tools: ["resolve", "list_all"]
  feishu:
    enabled: false
    transport: stdio
    command: python
    args: ["-m", "mcp_servers.feishu.server"]
    env:
      LARK_APP_ID: "${LARK_APP_ID}"
      LARK_APP_SECRET: "${LARK_APP_SECRET}"
      LARK_DOMAIN: "${LARK_DOMAIN}"
